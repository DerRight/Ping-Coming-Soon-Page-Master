<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="./script.js"></script>


    <title>Frontend Mentor | Ping coming soon page</title>
  </head>
  <body>
    <figure class="logo">
      <img src="./images/logo.svg" alt="LOGO" />
    </figure>

    <section class="title">
      <section class="title-text">
        <p class="">We are launching <p class="title-soon">soon!</p></p>
      </section>
      <p class="subtitle">Subscribe and get notified</p>
    </section>

    <section class="area-email">
      <section class="aaa">
        <input
          id="input-email"
          type="email"
          placeholder="Your email address..."
          class="input-email"
        />
        <p id="error-message" class="error-message">Please provide a vaild email address</p>
      </section>
      <button class="btn-email" onclick="validEmail()">Notify Me</button>
    </section>

    <figure class="pic">
      <img
        src="./images/illustration-dashboard.png"
        alt="Dashboard illustration"
      />
    </figure>

    <figure class="icon">
      <i class="fa-brands fa-facebook-f iicon"></i>
      <i class="fa-brands fa-twitter iicon"></i>
      <i class="fa-brands fa-instagram iicon"></i>
    </figure>

    <p class="copy">&copy; Copyright Ping. All rights reserved.</p>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">WeiHu</a>.
    </footer>
  </body>
</html>
